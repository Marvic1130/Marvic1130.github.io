- title: Research Summary
  type: text
  contents: >
    Ph.D. student at the Graduate School of Information, Yonsei University.
    My research focuses on model compression, TinyML, and AIoT-aware federated learning —
    with the goal of enabling efficient, collaborative AI on resource-constrained IoT devices.

